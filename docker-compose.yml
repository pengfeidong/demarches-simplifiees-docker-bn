version: "3.7"
services:
  db:
    image: postgis/postgis:15-3.4
    restart: always
    container_name: ds_db
    environment:
      POSTGRES_DB: ds
      POSTGRES_USER: ds
      POSTGRES_PASSWORD: ds
    ports:
      - "5432:5432"
    volumes:
      - type: volume
        source: ds-db-volume
        target: /var/lib/postgresql/data
    networks:
      - ds_network

  app:
    build:
      context: .
    container_name: ds_app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DB_DATABASE: ds
      DB_USERNAME: ds
      DB_PASSWORD: ds
      DB_HOST: db
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      DS_ENTRYPOINT: "true"
      CLASSIC_SMTP_ENABLED: "enabled"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_AUTHENTICATION: "plain"
      REDIS_URL: "redis://redis:6379/0"
      RAILS_QUEUE_ADAPTER: "inline"
    networks:
      - ds_network

  job:
    build:
      context: .
    container_name: ds_job
    depends_on:
      - db
    environment:
      DB_DATABASE: ds
      DB_USERNAME: ds
      DB_PASSWORD: ds
      DB_HOST: db
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      DS_ENTRYPOINT: "true"
      CLASSIC_SMTP_ENABLED: "enabled"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_AUTHENTICATION: "plain"
      RAILS_QUEUE_ADAPTER: "inline"
    command: bundle exec rake jobs:work
    networks:
      - ds_network

  sidekiq:
    build:
      context: .
    container_name: ds_sidekiq
    depends_on:
      - db
    environment:
      DB_DATABASE: ds
      DB_USERNAME: ds
      DB_PASSWORD: ds
      DB_HOST: db
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      DS_ENTRYPOINT: "true"
      CLASSIC_SMTP_ENABLED: "enabled"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_AUTHENTICATION: "plain"
      SKYLIGHT_ENABLED: false
      REDIS_URL: "redis://redis:6379/0"
    command: bundle exec sidekiq
    networks:
      - ds_network

  redis:
    image: redis:7
    container_name: ds_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ds_network

  mailhog:
    container_name: ds_mailhog
    image: mailhog/mailhog
    restart: always
    ports:
      - 1025:1025
      - 8025:8025
    networks:
      - ds_network

networks:
  ds_network:
    name: ds_network
    driver: bridge

volumes:
  ds-db-volume:
